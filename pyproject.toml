[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-local-tts"
version = "2.0.1"
description = "Ultralight CLI for local text-to-speech, powered by Kokoro by default"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tts", "text-to-speech", "kokoro", "piper", "llama.cpp", "cli", "offline"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# No runtime dependencies. Standard library only, on purpose.
dependencies = []

[project.urls]
Homepage = "https://github.com/rperez93/local-tts"
Repository = "https://github.com/rperez93/local-tts"
Issues = "https://github.com/rperez93/local-tts/issues"

[project.scripts]
tts = "localtts.cli:main"
local-tts = "localtts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localtts = ["agent_skills/*.md"]
