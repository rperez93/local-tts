[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tts"
version = "1.9.2"
description = "Ultralight CLI for local text-to-speech, powered by Kokoro by default"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tts", "text-to-speech", "kokoro", "piper", "llama.cpp", "cli", "offline"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# No runtime dependencies. Standard library only, on purpose.
dependencies = []

# Optional: a real phonemizer. Upstream transcribes with hand-written rules -- exact
# for Spanish, partial for English, nothing else -- because it may not depend on
# anything. With this extra installed, every language espeak knows works, and the rules
# become a fallback. 22 MB, espeak's own binary included, no system package needed.
#
#     pip install -e ".[phonemes]"
[project.optional-dependencies]
phonemes = ["phonemizer>=3.0", "espeakng-loader>=0.2"]

[project.scripts]
tts = "localtts.cli:main"
local-tts = "localtts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localtts = ["agent_skills/*.md"]
